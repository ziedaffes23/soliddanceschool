<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>News — Solid Dance School</title>
<link rel="icon" href="/assets/solid-dance-school-logo.png">
<link rel="stylesheet" href="/css/solid.css">
</head>
<body data-admin="true">
<div class="ops-root"><main class="ops-content">
  <div class="admin-top"><h1 class="admin-title">NEWS.</h1></div>
  <div class="admin-panel">
    <h2 data-crud-title>Add item</h2>
    <form data-crud-form class="form-grid">
      <input type="hidden" name="id">
      <div class="field"><label>Title</label><input name="title" required></div>
      <div class="field"><label>Date</label><input name="date" type="date"></div>
      <div class="field"><label>Author</label><input name="author" placeholder="Solid"></div>
      <div class="field"><label>Published</label><select name="published"><option value="true">Published</option><option value="false">Hidden</option></select></div>
      <div class="field full"><label>Excerpt</label><textarea name="excerpt" placeholder="Short summary shown on the news page."></textarea></div>
      <div class="field full admin-actions"><button class="admin-btn" type="submit">Save item</button><button class="admin-btn secondary" type="button" data-crud-cancel hidden>Cancel edit</button></div>
    </form>
  </div>
  <div class="admin-panel"><h2>Content library</h2><div data-table></div></div>
</main></div>
<div class="toast"></div>
<script src="/js/supabase-config.js"></script>
<script src="/js/supabase.js"></script>
<script src="/js/admin.js?v=solid1"></script>
<script>initAdmin('news');</script>
</body>
</html>
