name = "solid-dance-school"
main = "worker/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[build]
command = "node scripts/build-cloudflare.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Daily payment reminders (07:00 UTC = 08:00 in Tunisia): emails parents whose payment is due tomorrow.
[triggers]
crons = ["0 7 * * *"]
