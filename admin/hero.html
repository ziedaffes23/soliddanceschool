<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero management — Solid</title><link rel="stylesheet" href="../css/main.css"></head><body data-admin="true"><div class="admin-shell"><main class="admin-main"><div class="admin-top"><h1 class="admin-title">HERO.</h1></div><div class="admin-panel"><h2>Media & content</h2><form id="heroForm" class="form-grid"><div class="field"><label>Hero type</label><select name="type"><option value="image">Image</option><option value="video">Video</option></select></div><div class="field"><label>Label</label><input name="label"></div><div class="field full"><label>Headline — one line per beat</label><textarea name="headline"></textarea></div><div class="field"><label>Subheadline</label><input name="subheadline"></div><div class="field"><label>CTA text</label><input name="ctaText"></div><div class="field"><label>CTA URL</label><input name="ctaUrl"></div><div class="field"><label>Image URL</label><input name="imageUrl" type="url"></div><div class="field"><label>Mobile image URL</label><input name="mobileImageUrl" type="url"></div><div class="field"><label>Video URL</label><input name="videoUrl" type="url"></div><div class="field"><label>Poster URL</label><input name="posterUrl" type="url"></div><div class="field"><label>Overlay strength</label><input name="overlay" type="range" min="0" max="100"></div><div class="field"><label><input name="active" type="checkbox"> Hero active</label></div><div class="field full"><button class="admin-btn" type="submit">Save hero</button></div></form></div></main></div><div class="toast"></div><script src="../js/admin.js"></script><script>initAdmin('hero');</script></body></html>
