<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schedules — Solid</title>
<link rel="icon" href="/assets/solid-dance-school-logo.png">
<link rel="stylesheet" href="/css/solid.css?v=solid7">
</head>
<body data-admin="true">
<div class="ops-root"><main class="ops-content">
  <div class="admin-top"><h1 class="admin-title">SCHEDULES.</h1></div>
  <div class="admin-panel">
    <h2 data-crud-title>Add item</h2>
    <form data-crud-form class="form-grid">
      <input type="hidden" name="id">
      <div class="field"><label>Day</label><input name="day" placeholder="Monday" required></div>
      <div class="field"><label>Time</label><input name="time" placeholder="17:30 – 19:00"></div>
      <div class="field"><label>Class</label><input name="class"></div>
      <div class="field"><label>Availability</label><input name="availability" placeholder="Open / Full / Ask us"></div>
      <div class="field"><label>Teacher</label><input name="teacher"></div>
      <div class="field"><label>Room</label><input name="room"></div>
      <div class="field full admin-actions"><button class="admin-btn" type="submit">Save item</button><button class="admin-btn secondary" type="button" data-crud-cancel hidden>Cancel edit</button></div>
    </form>
  </div>
  <div class="admin-panel"><h2>Content library</h2><div data-table></div></div>
</main></div>
<div class="toast"></div>
<script src="/js/supabase-config.js"></script>
<script src="/js/supabase.js"></script>
<script src="/js/admin.js?v=solid7"></script>
<script>initAdmin('schedules');</script>
</body>
</html>
