<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Classes — Solid Dance School</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/solid-2026.css?v=1">
</head>
<body data-admin="true">
  <div class="ops-root">
    <main class="ops-content">
      <div class="admin-top"><h1 class="admin-title">CLASSES.</h1></div>
      <div class="admin-panel">
        <h2 id="classFormTitle">Add class</h2>
        <form id="classForm" class="form-grid">
          <input type="hidden" name="id">
          <div class="field"><label for="className">Name</label><input id="className" name="name" required></div>
          <div class="field"><label for="classStyle">Style</label><input id="classStyle" name="style" required></div>
          <div class="field"><label for="classAge">Age</label><input id="classAge" name="age" placeholder="6–11 or 12+"></div>
          <div class="field"><label for="classLevel">Level</label><input id="classLevel" name="level" placeholder="Beginner, Open..."></div>
          <div class="field"><label for="classTeacher">Teacher</label><input id="classTeacher" name="teacher"></div>
          <div class="field"><label for="classSchedule">Schedule</label><input id="classSchedule" name="schedule" placeholder="Monday · 18:00"></div>
          <div class="field full"><label for="classDescription">Description</label><textarea id="classDescription" name="description" placeholder="Describe the class for the public website."></textarea></div>
          <div class="field full admin-actions">
            <button class="admin-btn" type="submit" id="classSaveButton">Save class</button>
            <button class="admin-btn secondary" type="button" id="classCancelButton" hidden>Cancel edit</button>
          </div>
        </form>
      </div>
      <div class="admin-panel">
        <h2>Class library</h2>
        <div data-class-table></div>
      </div>
    </main>
  </div>
  <div class="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/supabase.js"></script>
  <script src="/js/admin.js?v=classes2"></script>
  <script>initAdmin('classes');</script>
</body>
</html>
