<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact & registration — Solid Dance School</title><meta name="description" content="Solid Dance School in Sfax, Tunisia — contemporary movement, classes and community."><link rel="canonical" href="https://soliddanceschool.netlify.app/contact.html"><meta property="og:title" content="Contact & registration — Solid Dance School"><meta property="og:description" content="Move different with Solid Dance School."><meta property="og:type" content="website"><link rel="stylesheet" href="css/main.css"><link rel="stylesheet" href="css/refined.css?v=ops1"></head><body data-page="contact"><main><section class="page-hero"><div class="eyebrow">Solid / Begin here</div><h1>COME<br>MOVE.</h1></section><section class="section"><div class="split"><div><h2 class="section-title">REGISTER<br>FOR A<br>TRIAL.</h2><p>[NUMBER]<br>[EMAIL]<br>[ADDRESS]</p><a class="button" href="https://wa.me/[NUMBER]">WhatsApp fallback</a></div><form id="registrationForm" class="form-grid"><div class="field"><label for="name">Full name</label><input id="name" name="name" required></div><div class="field"><label for="phone">Phone</label><input id="phone" name="phone" required pattern="[0-9 +()-]{7,}"></div><div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required></div><div class="field"><label for="dob">Date of birth</label><input id="dob" name="dob" type="date"></div><div class="field"><label for="age">Age group</label><input id="age" name="ageGroup" type="text" placeholder="e.g. 13+" required></div><div class="field"><label for="parentName">Parent name (if minor)</label><input id="parentName" name="parentName"></div><div class="field"><label for="parentPhone">Parent phone</label><input id="parentPhone" name="parentPhone"></div><div class="field full"><label for="address">Address</label><input id="address" name="address"></div><div c
