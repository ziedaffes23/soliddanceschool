<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hero management — Solid</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="icon" href="/assets/solid-dance-school-logo.png">
  <link rel="stylesheet" href="/css/solid.css?v=solid18"><link rel="stylesheet" href="/css/admin.css?v=solid15"></head><body data-admin="true"><div class="ops-root"><main class="ops-content"><div class="admin-top"><h1 class="admin-title">HERO.</h1></div><div class="admin-panel"><h2>Media & content</h2><form id="heroForm" class="form-grid"><div class="field"><label>Hero type</label><select name="type"><option value="image">Image</option><option value="video">Video</option></select></div><div class="field"><label>Label</label><input name="label"></div><div class="field full"><label>Headline — one line per beat</label><textarea name="headline"></textarea></div><div class="field"><label>Subheadline</label><input name="subheadline"></div><div class="field"><label>CTA text</label><input name="ctaText"></div><div class="field"><label>CTA URL</label><input name="ctaUrl"></div><div class="field full hero-upload"><label>Upload a photo or video for the homepage</label><input type="file" id="heroFile" accept="image/*,video/mp4,video/webm,video/quicktime"><small class="field-help" id="heroUploadStatus">Photos: JPG/PNG/WebP. Videos: MP4 or WebM, up to 50 MB (short, muted loops work best). It is published as soon as the upload finishes.</small></div><div class="field"><label>Image URL</label><input name="imageUrl" type="text"></div><div class="field"><label>Mobile image URL</label><input name="mobileImageUrl" type="text"></div><div class="field"><label>Video URL — YouTube, Vimeo or MP4/WebM</label><input name="videoUrl" type="text" placeholder="https://www.youtube.com/watch?v=..."></div><div class="field"><label>Poster URL</label><input name="posterUrl" type="text"></div><div class="field"><label>Overlay strength</label><input name="overlay" type="range" min="0" max="100"></div><div class="field"><label><input name="active" type="checkbox"> Hero active</label></div><div class="field full"><button class="admin-btn" type="submit">Save hero</button></div></form></div></main></div><div class="toast"></div><script>
document.addEventListener('change',async e=>{const inp=e.target.closest('#heroFile');if(!inp||!inp.files[0])return;
const st=document.querySelector('#heroUploadStatus'),f=inp.files[0],form=document.querySelector('#heroForm'),isVideo=/^video\//.test(f.type);
inp.disabled=true;try{const url=await window.solidCloud.upload(f,m=>st.textContent=m);
const mine=v=>/\/storage\/v1\/object\/public\/site-media\//.test(v||'');if(isVideo){form.elements.videoUrl.value=url;form.elements.type.value='video'}else{if(mine(form.elements.videoUrl.value))form.elements.videoUrl.value='';form.elements.imageUrl.value=url;form.elements.type.value='image'}
form.elements.active.checked=true;form.requestSubmit();st.textContent='Uploaded and published ✓ — the homepage now uses it (the previous uploaded file is deleted automatically).';st.style.color='var(--lime)'}
catch(err){st.textContent='Upload failed: '+(err.message||err);st.style.color='var(--red)'}finally{inp.disabled=false;inp.value=''}});
</script>
<script src="/js/supabase-config.js"></script><script src="/js/supabase.js"></script><script src="/js/admin.js?v=solid13"></script><script>initAdmin('hero');</script></body></html>
