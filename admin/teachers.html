<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teachers — Solid</title>
<link rel="icon" href="/assets/solid-dance-school-logo.png">
<link rel="stylesheet" href="/css/solid.css?v=solid8">
</head>
<body data-admin="true">
<div class="ops-root"><main class="ops-content">
  <div class="admin-top"><h1 class="admin-title">TEACHERS.</h1></div>
  <div class="admin-panel">
    <h2 data-crud-title>Add item</h2>
    <form data-crud-form class="form-grid">
      <input type="hidden" name="id">
      <div class="field"><label>Name</label><input name="name" required></div>
      <div class="field"><label>Styles</label><input name="styles" placeholder="Hip Hop · House"></div>
      <div class="field full"><label>Bio</label><textarea name="bio" placeholder="Short teacher bio for the public site."></textarea></div>
      <div class="field"><label>Portrait image URL</label><input name="imageurl" type="url" placeholder="https://..."></div>
      <div class="field"><label>Portrait alt text</label><input name="alt"></div>
      <div class="field"><label>Published</label><select name="published"><option value="true">Published</option><option value="false">Hidden</option></select></div>
      <div class="field full admin-actions"><button class="admin-btn" type="submit">Save item</button><button class="admin-btn secondary" type="button" data-crud-cancel hidden>Cancel edit</button></div>
    </form>
  </div>
  <div class="admin-panel"><h2>Content library</h2><div data-table></div></div>
</main></div>
<div class="toast"></div>
<script src="/js/supabase-config.js"></script>
<script src="/js/supabase.js"></script>
<script src="/js/admin.js?v=solid8"></script>
<script>initAdmin('teachers');</script>
</body>
</html>
